<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <script>
    /* Old deep link play.html?date=YYYY-MM-DD -> index.html (which opens Word Master). Query and hash are kept. */
    location.replace("index.html" + (location.search || "") + (location.hash || ""));
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=index.html"/></noscript>
</head>
<body>
  <p><a href="index.html">Continue to Word Master</a></p>
</body>
</html>
